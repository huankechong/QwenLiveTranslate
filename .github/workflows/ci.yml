name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deps
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests (offscreen, no audio devices needed)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest tests/ -q
        timeout-minutes: 10

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deps
        run: pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: pyinstaller --noconfirm QwenLiveTranslate.spec
        timeout-minutes: 15
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QwenLiveTranslate-win64
          path: dist/QwenLiveTranslate.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: QwenLiveTranslate-win64
          path: dist
      - name: Create GitHub Release with exe
        uses: softprops/action-gh-release@v2
        with:
          files: dist/QwenLiveTranslate.exe
          generate_release_notes: true
