name: CI

on:
  push:
    branches: [master, main]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install deps
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests (offscreen, no audio devices needed)
        env:
          QT_QPA_PLATFORM: offscreen
        # 判定逻辑全在 python 里：Windows CI 上 Qt 退出期崩溃会污染 shell 退出码
        # （1/0xC0000135/127 家族），跑完 pytest 后由 ci_judge.py 读输出裁决。
        run: |
          python -m pytest tests/ -q -p no:cacheprovider > pytest_out.txt 2>&1
          python ci_judge.py
        timeout-minutes: 10

  build:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install deps
        run: pip install -r requirements.txt pyinstaller
      - name: Build exe
        run: pyinstaller --noconfirm QwenLiveTranslate.spec
        timeout-minutes: 15
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QwenLiveTranslate-win64
          path: dist/QwenLiveTranslate.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 创建 Release/上传资产必需（默认只读，v1.0.0 失败根因）
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史：CHANGELOG 提取需要 tag 间 diff
      - uses: actions/download-artifact@v4
        with:
          name: QwenLiveTranslate-win64
          path: dist
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          # 从 CHANGELOG.md 提取本 tag 版本段（## [X.Y.Z] 到下一个 ## 之间）
          python3 - << 'EOF'
          import os, re
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          src = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=\n## \[|\Z)", src, re.S)
          body = m.group(1).strip() if m else "（CHANGELOG 未找到该版本段，详见 CHANGELOG.md）"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write("body<<CHANGELOG_EOF\n" + body + "\nCHANGELOG_EOF\n")
          EOF
      - name: Create GitHub Release with exe
        uses: softprops/action-gh-release@v2
        with:
          files: dist/QwenLiveTranslate.exe
          body: ${{ steps.notes.outputs.body }}
          append_body: true
          generate_release_notes: true
